<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 232" role="img" aria-label="역량 관리 솔루션 v2 구조도. 편집기가 도메인 API를 부르고, 모든 쓰기 요청은 권한 확인, 버전 갱신, 서버 서명, 저장 순서를 거쳐 기존 인덱스를 유지한 Elasticsearch에 저장된다.">
