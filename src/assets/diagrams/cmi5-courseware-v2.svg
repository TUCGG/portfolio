  <text class="sub" x="91" y="68" text-anchor="middle">+ 학습맵 성취기준</text>
  <rect class="node accent" x="195" y="20" width="150" height="64" rx="10"/>
  <text class="label accent-text" x="270" y="48" text-anchor="middle">수업꾸러미 편집기</text>
  <text class="sub accent-sub" x="270" y="68" text-anchor="middle">블록·AU 트리 편집</text>
