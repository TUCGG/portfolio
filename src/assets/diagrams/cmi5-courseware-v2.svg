<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-label="cmi5 수업꾸러미 저작도구 구조도. LCMS 콘텐츠와 학습맵 성취기준을 편집기에서 블록과 AU 트리로 엮고, cmi5.xml로 내보내 학습 플레이어에서 실행한다. 블록과 AU의 ID는 상위 ID를 이어 쓴다.">
  <defs>
    <marker id="cmi5-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
