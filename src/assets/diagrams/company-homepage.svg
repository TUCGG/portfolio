<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 232" role="img" aria-label="회사 홈페이지 구조도. Next.js 공개 페이지가 NestJS API를 거쳐 MySQL에 저장된 게시글을 보여준다. 게시글 이미지는 관리자 에디터에서 S3로 올리고 CDN 주소로 제공하며, 글을 수정하거나 삭제하면 남는 이미지를 정리한다.">
  <defs>
    <marker id="home-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0 0 10 5 0 10z"/>
    </marker>
  </defs>
  <rect class="node accent" x="16" y="20" width="190" height="64" rx="10"/>
  <text class="label accent-text" x="111" y="48" text-anchor="middle">Next.js</text>
  <text class="sub accent-sub" x="111" y="68" text-anchor="middle">공개 페이지, 메타 태그</text>
  <rect class="node" x="265" y="20" width="190" height="64" rx="10"/>
  <text class="label" x="360" y="48" text-anchor="middle">NestJS API</text>
  <text class="sub" x="360" y="68" text-anchor="middle">JWT 인증, TypeORM</text>
  <rect class="node" x="514" y="20" width="190" height="64" rx="10"/>
  <text class="label" x="609" y="48" text-anchor="middle">MySQL</text>
  <text class="sub" x="609" y="68" text-anchor="middle">게시글, 관리자</text>
  <path class="edge" d="M206 52H259" marker-end="url(#home-arrow)"/>
  <path class="edge" d="M455 52H508" marker-end="url(#home-arrow)"/>
  <text class="cap" x="16" y="134">게시글 이미지</text>
  <rect class="step" x="16" y="152" width="142" height="44" rx="22"/>
  <text class="label" x="87" y="179" text-anchor="middle">관리자 에디터</text>
  <rect class="step" x="198" y="152" width="142" height="44" rx="22"/>
  <text class="label" x="269" y="179" text-anchor="middle">S3 업로드</text>
  <rect class="step" x="380" y="152" width="142" height="44" rx="22"/>
  <text class="label" x="451" y="179" text-anchor="middle">CDN으로 제공</text>
  <rect class="step" x="562" y="152" width="142" height="44" rx="22"/>
  <text class="label" x="633" y="179" text-anchor="middle">남는 이미지 정리</text>
  <path class="edge" d="M158 174H192" marker-end="url(#home-arrow)"/>
  <path class="edge" d="M340 174H374" marker-end="url(#home-arrow)"/>
  <path class="edge" d="M522 174H556" marker-end="url(#home-arrow)"/>
  <text class="sub" x="269" y="216" text-anchor="middle">presigned URL</text>
  <text class="sub" x="633" y="216" text-anchor="middle">글 수정·삭제 시</text>
</svg>
